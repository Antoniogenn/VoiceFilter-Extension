<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 260px; font-family: system-ui; padding: 10px; margin: 0; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .row { margin: 6px 0; }
  button { width: 100%; padding: 6px; margin-top: 4px; }
  .status { font-size: 11px; color: #555; margin-top: 6px; min-height: 30px; }
  .now { font-size: 15px; font-weight: bold; margin: 6px 0; text-align: center; }
  .voice-row { display:flex; align-items:center; gap:6px; padding:3px 4px; border-bottom:1px solid #eee; }
  .voice-row .lbl { font-size:12px; flex:0 0 auto; min-width:70px; cursor:pointer; }
  .voice-row .lbl:hover { text-decoration:underline; }
  .voice-row .lbl-input { font-size:12px; flex:0 0 auto; width:70px; }
  .voice-row input[type=range] { flex:1; min-width:0; }
  .voice-row .val { font-size:10px; color:#666; width:34px; text-align:right; }
  .dot { width:9px; height:9px; border-radius:50%; background:#ccc; flex:0 0 auto; }
  .dot.on { background:#2ecc40; }
</style>
</head>
<body>
  <h1>Voice Live</h1>
  <div class="row">
    <button id="start">Avvia rilevamento</button>
    <button id="stop" disabled>Stop</button>
  </div>
  <div class="row">
    <button id="clear" style="background:#fdf0f0;color:#a33;">Cancella voci salvate</button>
  </div>
  <div class="row">
    <label>Volume pass-through</label>
    <input type="range" id="weight" min="0" max="1" step="0.1" value="1">
  </div>
  <div class="row">
    <label for="host">Backend (host:porta)</label>
    <input type="text" id="host" value="127.0.0.1:8765" title="Indirizzo del backend Python (ws://HOST:PORTA/ws)">
  </div>
  <div class="row">
    <label for="heartbeat">Controlli ogni (ms)</label>
    <select id="heartbeat">
      <option value="32">32 ms</option>
      <option value="64" selected>64 ms</option>
      <option value="96">96 ms</option>
      <option value="128">128 ms</option>
      <option value="160">160 ms</option>
      <option value="192">192 ms</option>
      <option value="224">224 ms</option>
      <option value="256">256 ms</option>
    </select>
  </div>
  <div class="now" id="now">— nessuno —</div>
  <div style="font-size:12px;font-weight:bold;margin:8px 0 4px;">Voci rilevate</div>
  <div id="voices" style="border:1px solid #ddd;min-height:40px;padding:6px;font-size:12px;max-height:120px;overflow:auto;background:#fafafa;"></div>
  <div style="font-size:10px;color:#888;margin-top:4px;">☑ = proteggi la voce (non viene eliminata dopo 5 min di assenza)</div>
  <div class="status" id="log" style="height:60px;overflow:auto;font-size:10px;white-space:pre-wrap;"></div>
  <script src="browser-shim.js"></script>
  <script src="popup.js"></script>
</body>
</html>
